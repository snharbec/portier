[package]
name = "portier"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
futures = "0.3.34"
getrandom = "0.4.3"
hickory-resolver = "0.26.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
lol_html = "3.0.1"
mail-parser = "0.11.9"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# The server is the package above; the terminal client lives beside it.
[workspace]
members = [".", "tui"]
default-members = ["."]
