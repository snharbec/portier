[package]
name = "portier-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal client for Portier"

[[bin]]
name = "portier-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
html2text = "0.17.1"
ratatui = "0.30.2"
# Same TLS setup as the server: rustls with the ring provider, installed by hand.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
unicode-width = "0.2.2"
